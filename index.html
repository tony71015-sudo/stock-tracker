/* Cathay commission and P&L calculator, integrated into the original dashboard. */
.calc-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.88fr);gap:18px;align-items:start}
.calc-fields{padding:22px 24px}.calc-forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.calc-input{display:grid;gap:6px}.calc-input label{font-size:12px;font-weight:800;color:#5b7186}
.calc-input .field{width:100%}.calc-input .hint{font-size:11px;color:#8496a7;line-height:1.65}
.calc-input.wide{grid-column:1/-1}.calc-box{padding:22px 24px}
.calc-source{background:#f1f8fa;border:1px solid #dbeaf0;border-radius:12px;padding:12px 15px;font-size:12px;color:#547187;line-height:1.75;margin-top:15px}
.calc-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0}
.calc-kpi{padding:17px 18px;min-height:112px}.calc-kpi b{font-size:19px;display:block;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.calc-kpi .muted{font-size:11px}.calc-table-panel{margin-top:19px}.calc-table-panel .data-table th,.calc-table-panel .data-table td{padding:12px 13px}
.calc-table-panel .data-table tr.is-flat{background:#eef8f7}.calc-table-panel .data-table td.notes{color:#698295}
.calc-right-details{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:17px}
.calc-mini-line{padding:8px 0;border-bottom:1px solid #e9eff4;font-size:12px;display:flex;gap:7px;justify-content:space-between}
.calc-mini-line span{color:#8394a6}.calc-mini-line strong{font-variant-numeric:tabular-nums}
@media(max-width:1150px){.calc-layout{grid-template-columns:1fr}.calc-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.calc-forms{grid-template-columns:1fr}.calc-input.wide{grid-column:auto}.calc-kpis{gap:10px}.calc-kpi{padding:14px}.calc-right-details{grid-template-columns:1fr}.calc-fields,.calc-box{padding:18px}}

/* v1.2: valuation updates and documentation */
.valuation-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#eff8fa;border:1px solid #d5e8ed;padding:16px 20px;border-radius:13px;margin:8px 0 18px;color:#3f6677}
.valuation-banner strong{font-size:13px;color:#245366}.valuation-banner p{margin:5px 0 0;font-size:12px;line-height:1.75}
.val-secondary{font-size:11px;color:#8799a8;margin-top:6px;line-height:1.5}
.val-pnl{font-weight:850;font-size:14px}.val-pnl .percent{display:block;font-size:11px;font-weight:700;margin-top:5px}
.quote-chip{display:inline-block;margin-top:5px;border-radius:5px;background:#f0f4f8;color:#60798e;padding:2px 6px;font-size:10px}
.docs-hero{padding:25px 28px;background:linear-gradient(130deg,#123649,#0e6671);color:#fff;border-radius:16px;margin-bottom:20px}
.docs-hero h2{font-size:21px;margin:6px 0}.docs-hero p{color:#c4e1e6;font-size:13px;line-height:1.85;max-width:860px}
.docs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.docs-card{padding:23px 25px}.docs-card h3{margin:0 0 13px;font-size:15px}.docs-card p,.docs-card li{font-size:12px;color:#6c8195;line-height:1.85}
.docs-card ul{padding-left:19px;margin-bottom:0}.docs-steps{padding:0 0 0 21px;margin:0}.docs-steps li{margin:0 0 8px}
@media(max-width:820px){.docs-grid{grid-template-columns:1fr}.valuation-banner{align-items:flex-start}.docs-card{padding:19px}}

/* v1.4.2: independent, client-side intraday risk simulation */
.intraday-panel{margin:20px 0;scroll-margin-top:93px;overflow:hidden}
.intraday-body{padding:0 23px 22px}.intraday-selectonly{padding:0 23px 22px}
.intraday-selectonly label,.intraday-controls label{font-weight:750;color:#536c7f;font-size:12px;display:grid;gap:7px}
.intraday-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.intraday-controls .field{width:100%}.intraday-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 10px}
.intraday-output{margin-top:20px;background:#f8fbfd;border:1px solid #dce9ef;border-radius:13px;overflow:hidden}
.intraday-status{display:flex;align-items:flex-start;gap:5px;flex-direction:column;padding:14px 18px;background:#eaf8f2;color:#166c51;font-size:13px}
.intraday-status.danger{background:#fce9ec;color:#ac394c}.intraday-status.warning{background:#fff3db;color:#92632a}
.intraday-status span{font-size:11px;opacity:.86}.intraday-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.intraday-kpis>div{padding:17px 16px;border-right:1px solid #e4edf2}.intraday-kpis>div:last-child{border-right:0}
.intraday-kpis small{color:#7990a0;font-size:11px;display:block;margin-bottom:9px}.intraday-kpis strong{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}
.intraday-note{padding:14px 18px;border-top:1px solid #e0eaf0;line-height:1.8;color:#647c8c;font-size:12px}
.intraday-caution{margin:17px 0 0}
@media(max-width:1000px){.intraday-controls{grid-template-columns:repeat(2,minmax(0,1fr))}.intraday-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:550px){.intraday-controls{grid-template-columns:1fr}.intraday-kpis strong{font-size:15px}.intraday-body{padding:0 14px 16px}}

<script>/* Pure portfolio & tracking calculations; no external network. */
const FinanceCore = (() => {
  const EPS = 1e-7;
  const defaults = { stop: 5, activation: 10, trail: 5 };
  const normSymbol = s => String(s || '').trim().toUpperCase();
  const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && !Number.isNaN(Date.parse(s+'T12:00:00'));
  const n = v => Number(v) || 0;
  const txSorted = ts => ts.map((t,i)=>({...t, _order:i})).sort((a,b)=>a.date.localeCompare(b.date) || a._order - b._order);
  const clone = s => ({symbol:s.symbol,shares:s.shares,cost:s.cost,avg:s.shares>EPS?s.cost/s.shares:0,realized:s.realized,cycle:s.cycle,cycleStart:s.cycleStart});
  function ledger(transactions, asOf='9999-12-31') {
    const map = new Map(); const entries = []; const errors=[];
    for (const tx of txSorted(transactions)) {
      if (tx.date > asOf) continue;
      const sym = normSymbol(tx.symbol), qty=n(tx.shares), px=n(tx.price), fee=n(tx.fee), tax=n(tx.tax);
      if (!sym || !validDate(tx.date) || !['buy','sell'].includes(tx.side) || !(qty>0) || !(px>0) || fee<0 || tax<0) {
        errors.push(`第 ${tx._order+1} 筆交易資料不完整`);continue;
      }
      let s=map.get(sym);
      if (!s){s={symbol:sym,shares:0,cost:0,avg:0,realized:0,cycle:0,cycleStart:''}; map.set(sym,s);}
      let pnl=0;
      if (tx.side==='buy') {
        if (s.shares < EPS){s.cycle += 1; s.cycleStart=tx.date;s.shares=0;s.cost=0;}
        s.cost += qty*px + fee; s.shares += qty;
      } else {
        if (qty > s.shares + EPS) {errors.push(`${tx.date} ${sym} 賣出 ${qty} 股，超過當時持股 ${s.shares} 股`);continue;}
        const removed=s.shares? s.cost * (qty/s.shares):0;
        pnl=qty*px-fee-tax-removed; s.realized+=pnl;
        s.shares -= qty; s.cost -=removed;
        if(s.shares < EPS) {s.shares=0;s.cost=0;}
      }
      s.avg=s.shares>0?s.cost/s.shares:0;
      entries.push({...tx,symbol:sym,pnl,after:clone(s)});
    }
    return { positions: map, entries, errors };
  }
  function snapshot(transactions,symbol,date){return ledger(transactions,date).positions.get(normSymbol(symbol)) || {shares:0,cost:0,avg:0,realized:0,cycle:0,cycleStart:''};}
  function quoteSorted(quotes){return quotes.map((q,i)=>({...q,_order:i})).sort((a,b)=>a.date.localeCompare(b.date)||a.symbol.localeCompare(b.symbol)||a._order-b._order);}
  function allTrackers(transactions,quotes,settings=defaults) {
    const items=[];const state=new Map();const all=quoteSorted(quotes);
    for(const q of all) {
      const symbol=normSymbol(q.symbol),p=snapshot(transactions,symbol,q.date);
      if(!p.shares) {items.push({...q, symbol, position:p, peak:0, stop:0,active:false,status:'無持股',rate:null,drawdown:null});continue;}
      let s=state.get(symbol);
      if(!s || s.cycle!==p.cycle || s.cycleStart!==p.cycleStart){s={cycle:p.cycle,cycleStart:p.cycleStart,peak:0,active:false,stop:0};state.set(symbol,s);}
      if(q.date>=p.cycleStart) s.peak=Math.max(s.peak,n(q.high));
      if(n(q.high)>=p.avg*(1+n(settings.activation)/100))s.active=true;
      const basicStop = p.avg*(1-n(settings.stop)/100);
      const trailStop = s.peak*(1-n(settings.trail)/100);
      s.stop=s.active?Math.max(s.stop,trailStop):basicStop;
      const touched=n(q.low)>0 && n(q.low)<=s.stop+EPS;
      let status=touched?(s.active?'觸及移動停利':'觸及初始停損'):(s.active?'移動停利中':'未啟動');
      items.push({...q,symbol,position:p,peak:s.peak,stop:s.stop,active:s.active,status,touched,rate:p.avg? (n(q.close)-p.avg)/p.avg*100:null,drawdown:s.peak? (s.peak-n(q.close))/s.peak*100:null, sameDayUncertain:touched&&s.active&&n(q.high)>=p.avg*(1+n(settings.activation)/100)});
    }
    return items;
  }
  function totals(transactions,quotes,date,settings=defaults,manualPrices=[]){
    const l=ledger(transactions,date), tracks=allTrackers(transactions,quotes,settings);
    const positions=[];let cost=0,value=0,realized=0,knownCost=0,unknownCount=0;
    for (const [symbol,p] of l.positions.entries()){
      realized+=p.realized;
      if(p.shares <= 0) continue;
      // A manual reference price is ONLY for valuation. It never creates a fake OHLC bar
      // and therefore never triggers a trailing-stop alert or modifies the peak price.
      const series=tracks.filter(q=>q.symbol===symbol && q.date<=date && q.position.shares>0 && q.position.cycle===p.cycle);
      const lastTracked=series.length?series[series.length-1]:null;
      const quick=(Array.isArray(manualPrices)?manualPrices:[])
        .filter(q=>q.symbol===symbol && q.date<=date && q.date>=p.cycleStart && Number(q.price)>0)
        .sort((a,b)=>a.date.localeCompare(b.date)).at(-1);
      const useManual=!!quick && (!lastTracked || quick.date>=lastTracked.date);
      const latest=useManual?{symbol,date:quick.date,close:Number(quick.price),manual:true}:lastTracked;
      const market=latest?latest.close*p.shares:null;
      cost+=p.cost;
      if(market!==null){value+=market;knownCost+=p.cost;} else unknownCount++;
      positions.push({...p,latest,lastTracked,market,pnl:market===null?null:market-p.cost,
        pnlRate:market===null||!p.cost?null:(market-p.cost)/p.cost*100});
    }
    positions.sort((a,b)=>b.cost-a.cost);
    return {positions,cost,value,pnl:value-knownCost,realized,unknownCount,tracks};
  }
  // Non-executable intraday assessment; never writes to daily OHLC or adjusts portfolio totals.
  function intraday(transactions,quotes,settings=defaults,input){
    const symbol=normSymbol(input.symbol),date=String(input.date||''),price=Number(input.price);
    const high=input.high===null||input.high===undefined||input.high===''?null:Number(input.high);
    const low=input.low===null||input.low===undefined||input.low===''?null:Number(input.low);
    if(!validDate(date)||!symbol||!Number.isFinite(price)||price<=0 ||
      (high!==null&&(!Number.isFinite(high)||high<price||high<=0)) ||
      (low!==null&&(!Number.isFinite(low)||low>price||low<=0)) ||
      (low!==null&&high!==null&&low>high)) throw Error('盤中價格不合理：最高價 ≥ 現價 ≥ 最低價；三者均應大於零。');
    const p=snapshot(transactions,symbol,date);
    if(!(p.shares>0))throw Error('指定日期尚無這檔股票的持股，請檢查交易日期或股票代號。');
    // Use only PRIOR dates; a recorded end-of-day bar must not leak tomorrow's info into the intraday simulation.
    const history=allTrackers(transactions,quotes,settings)
      .filter(q=>q.symbol===symbol&&q.date<date&&q.position.shares>0&&q.position.cycle===p.cycle&&q.date>=p.cycleStart);
    const previous=history.length?history[history.length-1]:null;
    const initialStop=p.avg*(1-n(settings.stop)/100),activationPrice=p.avg*(1+n(settings.activation)/100);
    const peak=Math.max(previous?.peak||0,high??price), active=!!previous?.active||peak>=activationPrice;
    const priorStop=previous?.active?previous.stop:initialStop;
    const stop=active?Math.max(previous?.active?previous.stop:0,peak*(1-n(settings.trail)/100)):initialStop;
    const gap=(price-stop)/stop*100, pnl=price*p.shares-p.cost;
    const touchingNow=price<=stop+EPS;
    const touchedEarlierKnown=low!==null&&low<=priorStop+EPS;
    const maybeTouched=low!==null&&low<=stop+EPS&&!touchedEarlierKnown;
    let status,level;
    if(touchingNow){status=active?'目前價已達移動停利警示線':'目前價已達初始停損警示線';level='danger';}
    else if(touchedEarlierKnown){status='盤中最低價已碰到原有警示線（請核實成交順序）';level='danger';}
    else if(maybeTouched){status='盤中最低價可能觸及新警示線（先後順序未知）';level='warning';}
    else{status=active?'移動停利已啟動，目前價高於警示線':'移動停利尚未啟動，目前價高於初始停損線';level='ok';}
    return {symbol,date,price,high,low,shares:p.shares,avg:p.avg,cost:p.cost,pnl,pnlRate:(pnl/p.cost)*100,
      peak,initialStop,activationPrice,priorStop,stop,active,gap,status,level,
      priorDate:previous?.date||null,priorActive:!!previous?.active,priorPeak:previous?.peak||0,
      incompleteHigh:high===null,incompleteLow:low===null};
  }
  function validateTrade(transactions,candidate,replaceId=null){
    const arr=transactions.filter(t=>t.id!==replaceId).concat(candidate);
    return ledger(arr).errors;
  }
  return { defaults,normSymbol,validDate,ledger,snapshot,allTrackers,totals,validateTrade,intraday };
})();
if(typeof module!=='undefined'&&module.exports)module.exports=FinanceCore;
</script>
<script>
/* Formula-faithful conversion of the supplied Cathay 2.8-discount Excel worksheet.
 * The stock ladder is copied from the sheet; custom increments support instruments
 * such as ETFs whose tick sizes need manual confirmation. */
const CathayCore=(()=>{
 const CHANGE_RATES=[.10,.09,.08,.07,.06,.05,.04,.035,.03,.02,.01,0,-.01,-.015,-.02,-.03,-.04,-.05,-.06,-.07,-.08,-.09,-.10];
 const NOTES={"0.1":"漲停參考","0.035":"短波停利","0.02":"當沖停利","0":"平盤","-0.015":"當沖停損","-0.1":"跌停參考"};
 const defaults={mode:'manual',symbol:'',manualPrice:69.6,manualQty:1000,holdQty:null,discount:.28,feeRate:.001425,taxMode:'cash',tickMode:'stock',customTick:.1,targetPrice:71};
 const roundYuan=n=>Math.round(n+1e-9);
 const stepFor=p=>p<10?.01:p<50?.05:p<100?.1:p<500?.5:p<1000?1:5;
 const normPrice=v=>Math.round(v*1000000)/1000000;
 const tickPrice=(raw,mode='stock',custom=.1)=>{const t=mode==='custom'?custom:stepFor(raw);return normPrice(Math.round(raw/t+1e-10)*t);};
 const paramsValid=p=>[p.base,p.qty,p.discount,p.feeRate].every(Number.isFinite)&&p.base>0&&p.qty>0&&p.discount>=0&&p.discount<=1&&p.feeRate>=0&&p.feeRate<=.1;
 function atSellPrice(p,sell){if(!paramsValid(p)||!Number.isFinite(sell)||sell<=0)return null;
  const buyFee=p.existing?0:roundYuan(p.base*p.qty*p.feeRate*p.discount);
  const sellFee=roundYuan(sell*p.qty*p.feeRate*p.discount);
  const tax=roundYuan(sell*p.qty*(p.taxMode==='daytrade'?.0015:.003));
  const spread=(sell-p.base)*p.qty;
  const net=spread-buyFee-sellFee-tax;
  return {buyFee,sellFee,tax,spread,net,roi:net/(p.base*p.qty),selling:sell};}
 function scenario(p,delta){const theory=p.base*(1+delta);const selling=tickPrice(theory,p.tickMode,p.customTick);
  return {...atSellPrice(p,selling),delta,theory,selling,note:NOTES[String(delta)]||''};}
 function findBreakEven(p){if(!paramsValid(p))return null;
  // Each tested price is a valid quoted increment in the chosen tick scheme.
  let tick=p.tickMode==='custom'?p.customTick:stepFor(p.base);
  if(!(tick>0))return null;
  let price=normPrice(Math.floor(p.base/tick)*tick);
  for(let i=0;i<12000;i++){
   const result=atSellPrice(p,price);if(result&&result.net>=0)return result;
   const nextTick=p.tickMode==='custom'?p.customTick:stepFor(price+1e-8);
   price=normPrice(price+nextTick);
  }return null;
 }
 return {CHANGE_RATES,defaults,stepFor,tickPrice,atSellPrice,scenario,findBreakEven,paramsValid};
})();
</script>

function parseCSV(input){
 const lines=[];let row=[],field='',inQuotes=false;input=input.replace(/^\ufeff/,'');
 for(let i=0;i<input.length;i++){
  const c=input[i];
  if(inQuotes){
   if(c==='"'&&input[i+1]==='"'){field+='"';i++;}
   else if(c==='"')inQuotes=false;
   else field+=c;
  }else if(c==='"')inQuotes=true;
  else if(c===','||c==='\t'){row.push(field);field='';}
  else if(c==='\n'||c==='\r'){
   if(c==='\r'&&input[i+1]==='\n')i++;
   row.push(field);if(row.some(x=>x.trim()))lines.push(row);
   row=[];field='';
  }else field+=c;
 }
 row.push(field);if(row.some(x=>x.trim()))lines.push(row);
 return lines;
}
function parseDate(v){v=String(v??'').trim();if(/^\d{5}(\.\d+)?$/.test(v)){const d=new Date(Date.UTC(1899,11,30)+Number(v)*86400000);return d.toISOString().slice(0,10);}const m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:v;}
function rowToData(rows){if(!rows.length)return {transactions:[],quotes:[],skipped:0};const header=rows[0].map(v=>String(v).toLowerCase().replaceAll(' ','').trim());const isTrade=header.some(h=>h.includes('買賣')||h.includes('方向')||h.includes('side'));const col=(arr)=>{for(const a of arr){const i=header.findIndex(h=>h.includes(a));if(i>=0)return i;}return -1;};const get=(r,labels,def='')=>{const i=col(labels);return i<0?def:r[i]??def;};let skipped=0,transactions=[],quotes=[];
 for(const r of rows.slice(1)){const date=parseDate(get(r,isTrade?['交易日期','日期']:['日期','追蹤日期']));const symbol=C.normSymbol(get(r,['股票代號','股票（文字）','股票','symbol']));if(!C.validDate(date)||!symbol){skipped++;continue;}
 if(isTrade){const sideText=String(get(r,['買賣方向','方向','買賣','side'])).trim();const side=/^(買進|買入|buy|b)$/i.test(sideText)?'buy':/^(賣出|賣掉|sell|s)$/i.test(sideText)?'sell':null;const shares=Number(get(r,['成交股數','股數','shares'])),price=Number(get(r,['成交單價','成交價','單價','price']));if(!side||!(shares>0)||!(price>0)){skipped++;continue;}transactions.push({id:genid(),date,symbol,name:get(r,['股票名稱','名稱','name']),side,shares,price,fee:Number(get(r,['手續費','fee'],0))||0,tax:Number(get(r,['交易稅','tax'],0))||0,note:get(r,['備註','note'])});}
 else{const high=Number(get(r,['最高價','今日最高價','high'])),low=Number(get(r,['最低價','今日最低價','low'])),close=Number(get(r,['收盤價','今日收盤價','close']));if(!(low>0&&low<=close&&close<=high)){skipped++;continue;}quotes.push({id:genid(),date,symbol,high,low,close});}
 }
 return {transactions,quotes,skipped};}
function importJSONFile(json){if(!json||!Array.isArray(json.transactions)||!Array.isArray(json.quotes))throw Error('JSON 格式不符，缺少交易或行情資料。');const newDb={...initial(),...json,settings:{...C.defaults,...(json.settings||{})},cathay:{...F.defaults,...(json.cathay||{})},manualPrices:Array.isArray(json.manualPrices)?json.manualPrices:[],intradayPrices:Array.isArray(json.intradayPrices)?json.intradayPrices:[]};
 if(C.ledger(newDb.transactions).errors.length)throw Error('匯入交易內容有數量或格式錯誤。');
 if(newDb.manualPrices.some(x=>!x||!C.validDate(x.date)||!x.symbol||!Number.isFinite(Number(x.price))||!(Number(x.price)>0)))throw Error('手動參考價包含無效日期、股票或價格。');
 if(!confirm(`匯入 JSON 備份會取代目前 ${db.transactions.length} 筆交易與 ${db.quotes.length} 筆行情。確定以新資料覆蓋嗎？`))return;
 db=newDb;save();notify(`已還原 ${db.transactions.length} 筆交易、${db.quotes.length} 筆行情`);}
function importCSVFile(text){const parsed=rowToData(parseCSV(text));const arr=parsed.transactions.length?'transactions':'quotes';const incoming=parsed[arr];if(!incoming.length)throw Error('CSV 沒有可辨識的資料列。請使用本工具匯出的格式。');
 if(!confirm(`準備合併 ${incoming.length} 筆 ${arr==='transactions'?'交易':'行情'}（跳過 ${parsed.skipped} 筆無效資料）。匯入前建議先備份。是否繼續？`))return;
 const unique=x=>arr==='transactions'?[x.date,x.symbol,x.side,x.shares,x.price,x.fee,x.tax,x.note].join('|'):[x.date,x.symbol].join('|');
 const seen=new Set(db[arr].map(unique));let added=0;const merged=[...db[arr]];
 for(const item of incoming){const key=unique(item);if(seen.has(key))continue;seen.add(key);merged.push(item);added++;}
 if(arr==='transactions'&&C.ledger(merged).errors.length)throw Error('匯入後會造成賣出超過持股，請檢查交易順序。');
 db[arr]=arr==='quotes'?merged.sort((a,b)=>a.date.localeCompare(b.date)):merged;
 save();notify(`已新增 ${added} 筆資料（略過重複 ${incoming.length-added} 筆）`);}
// Minimal in-browser .xlsx ZIP reader: no cloud upload, third-party JS, or online dependencies.
async function unzipXlsx(ab){const bytes=new Uint8Array(ab),dv=new DataView(ab);const u16=p=>dv.getUint16(p,true),u32=p=>dv.getUint32(p,true);let end=-1;for(let p=bytes.length-22;p>=Math.max(0,bytes.length-66000);p--){if(u32(p)===0x06054b50){end=p;break;}}
 if(end<0)throw Error('找不到 XLSX 壓縮檔資料。');const count=u16(end+10);let offset=u32(end+16);const entries=new Map();const td=new TextDecoder('utf-8');
 for(let i=0;i<count;i++){if(u32(offset)!==0x02014b50)throw Error('XLSX 目錄格式錯誤');const method=u16(offset+10),size=u32(offset+20),nl=u16(offset+28),el=u16(offset+30),cl=u16(offset+32),lho=u32(offset+42);const name=td.decode(bytes.slice(offset+46,offset+46+nl));entries.set(name,{method,size,lho});offset+=46+nl+el+cl;}
 async function get(path){path=path.replace(/^\//,'');const ent=entries.get(path);if(!ent)return null;const at=ent.lho;if(u32(at)!==0x04034b50)throw Error('XLSX 區塊無法解壓縮');const start=at+30+u16(at+26)+u16(at+28);const b=bytes.slice(start,start+ent.size);if(ent.method===0)return td.decode(b);if(ent.method!==8)throw Error('不支援的 XLSX 壓縮方式');if(typeof DecompressionStream==='undefined')throw Error('瀏覽器不支援本機 XLSX 解壓縮，請改用 Chrome 或 CSV。');const stream=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return td.decode(await new Response(stream).arrayBuffer());}
 return {get};}
const children=(n,ln)=>Array.from(n?.children||[]).filter(c=>c.localName===ln);
const first=(n,ln)=>children(n,ln)[0]||null;
function parseXlsxSheet(xml,shared){if(!xml)return [];const d=new DOMParser().parseFromString(xml,'application/xml');const data=first(d.documentElement,'sheetData');const rows=[];
 for(const row of children(data,'row')){const obj={};for(const cell of children(row,'c')){const addr=cell.getAttribute('r');const match=addr?.match(/^[A-Z]+/);if(!match)continue;const v=first(cell,'v');const t=cell.getAttribute('t');let value=v?.textContent??'';if(t==='s')value=shared[Number(value)]??'';if(t==='inlineStr')value=cell.textContent??'';if(value!=='')obj[match[0]]=value;}rows.push({row:Number(row.getAttribute('r')),cells:obj});}return rows;}
async function importExcel(file){const zip=await unzipXlsx(await file.arrayBuffer());const wbXML=await zip.get('xl/workbook.xml'),relXML=await zip.get('xl/_rels/workbook.xml.rels');if(!wbXML||!relXML)throw Error('無法讀取 Excel 工作表設定。');const w=new DOMParser().parseFromString(wbXML,'application/xml'),r=new DOMParser().parseFromString(relXML,'application/xml');const ids={};for(const rel of Array.from(r.documentElement.children)){if(rel.localName==='Relationship')ids[rel.getAttribute('Id')]=rel.getAttribute('Target');}
 const sheetPaths={};for(const sh of Array.from(w.getElementsByTagName('*')).filter(x=>x.localName==='sheet')){const rid=Array.from(sh.attributes).find(a=>a.localName==='id')?.value;let p=ids[rid]||'';if(p.startsWith('/'))p=p.slice(1);else if(!p.startsWith('xl/'))p='xl/'+p;sheetPaths[sh.getAttribute('name')]=p;}
 const sharedXML=await zip.get('xl/sharedStrings.xml');const shared=sharedXML?Array.from(new DOMParser().parseFromString(sharedXML,'application/xml').getElementsByTagName('*')).filter(x=>x.localName==='si').map(x=>x.textContent):[];
 const tr=await parseXlsxSheet(await zip.get(sheetPaths['交易明細']||''),shared),qr=await parseXlsxSheet(await zip.get(sheetPaths['交易追蹤表']||''),shared),sr=await parseXlsxSheet(await zip.get(sheetPaths['移動停利設定']||''),shared);
 if(!sheetPaths['交易明細']&&!sheetPaths['交易追蹤表'])throw Error('沒有找到「交易明細」或「交易追蹤表」；請選擇先前的移動停利 Excel。');
 const transactions=[],quotes=[];let skipped=0;
 for(const r of tr.filter(x=>x.row>=2)){const c=r.cells;if(!c.A&&!c.B&&!c.C&&!c.D&&!c.E)continue;const date=parseDate(c.A),symbol=C.normSymbol(c.B);const side=/買進/.test(c.C)?'buy':/賣出/.test(c.C)?'sell':null;const shares=Number(c.D),price=Number(c.E);
 if(!C.validDate(date)||!symbol||!side||!(shares>0)||!(price>0)){skipped++;continue;}
 transactions.push({id:genid(),date,symbol,name:'',side,shares,price,fee:Number(c.F||0),tax:Number(c.G||0),note:''});}
 for(const r of qr.filter(x=>x.row>=2)){const c=r.cells;if(!c.A&&!c.B&&!c.D&&!c.E&&!c.F)continue;const date=parseDate(c.A),symbol=C.normSymbol(c.B),high=Number(c.D),low=Number(c.E),close=Number(c.F);
 if(!C.validDate(date)||!symbol||!(low>0&&low<=close&&close<=high)){skipped++;continue;}
 quotes.push({id:genid(),date,symbol,high,low,close});}
 const test=C.ledger(transactions);if(test.errors.length)throw Error('Excel 交易紀錄存在錯誤：'+test.errors[0]);
 const settings={...C.defaults};const settingRows=Object.fromEntries(sr.map(x=>[x.row,x.cells]));if(Number(settingRows[2]?.F)>0)settings.stop=Number(settingRows[2].F)*100;if(Number(settingRows[3]?.F)>0)settings.activation=Number(settingRows[3].F)*100;if(Number(settingRows[4]?.F)>0)settings.trail=Number(settingRows[4].F)*100;
 if(!confirm(`Excel 讀取結果：${transactions.length} 筆交易、${quotes.length} 筆行情，略過 ${skipped} 筆不完整資料。\n\n匯入會覆蓋目前網站中的資料；建議先匯出 JSON 備份。要繼續嗎？`))return;
 db={...initial(),settings,transactions,quotes,etfSimulation:db.etfSimulation,cathay:{...(db.cathay||F.defaults)}};save();notify(`已從 Excel 匯入 ${transactions.length} 筆交易與 ${quotes.length} 筆行情`);}
async function handleImport(e){const file=e.target.files?.[0];if(!file)return;try{if(e.target.id==='jsonImport')importJSONFile(JSON.parse(await file.text()));else if(e.target.id==='csvImport')importCSVFile(await file.text());else await importExcel(file);}catch(err){console.error(err);alert('匯入失敗：'+err.message);}finally{e.target.value='';}}
function act(a){if(a==='newtrade')openModal('trade');else if(a==='newquote')openModal('quote');else if(a==='intrafocus'){$('#intradaySection')?.scrollIntoView({behavior:'smooth',block:'start'});$('#intraPrice')?.focus({preventScroll:true});}else if(a==='clearintraday'){const q=(db.intradayPrices||[]).find(x=>x.symbol===intraSymbol&&x.date===intraDate);if(q&&confirm(`確定刪除 ${intraDate} ${intraSymbol} 的盤中試算紀錄？不影響正式每日行情。`)){db.intradayPrices=db.intradayPrices.filter(x=>x!==q);save();notify('已刪除此筆盤中試算');}}else if(a==='closemodal')closeModal();else if(a==='demo')demo();else if(a==='exportjson'){db.lastBackupAt=new Date().toISOString();try{localStorage.setItem(STORAGE,JSON.stringify(db));}catch(err){persisted=false;}download('投資風控中心_完整備份_'+today()+'.json',JSON.stringify(db,null,2));render();notify('已啟動備份下載，請確認檔案已保存');}else if(a==='exporttrades')csvDownload('trades');else if(a==='exportquotes')csvDownload('quotes');else if(a==='clearall'){if(confirm('確定清空本機全部交易、每日行情、盤中試算、手動價格及設定？此操作無法復原。請務必先下載 JSON 備份並確認檔案可用。')){db=initial();save();notify('已清空資料');}}else if(a==='resetsettings'){if(confirm('要將停損 5%、啟動 10%、回檔 5% 恢復預設嗎？')){db.settings={...C.defaults};save();notify('已恢復預設策略');}}else if(a==='savesettings'){const settings={stop:Number($('#setStop').value),activation:Number($('#setActivation').value),trail:Number($('#setTrail').value)};if(!(settings.stop>0&&settings.stop<100&&settings.activation>0&&settings.activation<=200&&settings.trail>0&&settings.trail<100)){alert('請填入有效百分比：初始停損與回檔 0～100% 之間；啟動率 0～200%。');return;}db.settings=settings;save();notify('策略參數已更新，歷史追蹤已重新計算');}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page],[data-nav],[data-action],[data-price],[data-delprice],[data-inst-stock],[data-edittrade],[data-deltrade],[data-editquote],[data-delquote],[data-openstock]');if(!p)return;
 if(p.dataset.page||p.dataset.nav){active=p.dataset.page||p.dataset.nav;rowSearch='';render();$('#sidebar').classList.remove('open');$('#shade').classList.remove('open');window.scrollTo({top:0,behavior:'instant'});}
 if(p.dataset.action)act(p.dataset.action);
 if(p.dataset.price)openPriceModal(p.dataset.price);
 if(p.dataset.instStock){active='institutions';window.TradeCompassInstitutional?.selectCode(p.dataset.instStock);render();window.scrollTo(0,0);}
 if(p.dataset.delprice){const entry=db.manualPrices.find(x=>x.id===p.dataset.delprice);if(entry&&confirm(`要刪除 ${entry.date} ${entry.symbol} 的手動參考價 ${entry.price} 元嗎？`)){db.manualPrices=db.manualPrices.filter(x=>x.id!==entry.id);save();notify('已刪除這筆參考價格');}}
 if(p.dataset.edittrade){const t=db.transactions.find(x=>x.id===p.dataset.edittrade);if(t)openModal('trade',t);}if(p.dataset.deltrade)deleteEntry('trade',p.dataset.deltrade);
 if(p.dataset.editquote){const q=db.quotes.find(x=>x.id===p.dataset.editquote);if(q)openModal('quote',q);}if(p.dataset.delquote)deleteEntry('quote',p.dataset.delquote);
 if(p.dataset.openstock){stockFilter=p.dataset.openstock;active='tracking';render();window.scrollTo(0,0);}
});

// Calculator controls update only simulator preferences; portfolio records are unchanged.
function updateCathay(el){
 const c=db.cathay;
 switch(el.id){
  case 'ctMode':
   if(el.value==='holding'){
    const avail=[...C.ledger(db.transactions,asOf).positions.values()].filter(x=>x.shares>0);
    if(!avail.length){notify('截至查詢日沒有持股，請先新增交易紀錄');return;}
    c.mode='holding';if(!avail.some(x=>x.symbol===c.symbol))c.symbol=avail[0].symbol;
    c.holdQty=C.snapshot(db.transactions,c.symbol,asOf).shares;
   }else c.mode='manual';break;
  case 'ctSymbol':{
   c.symbol=el.value;
   if(c.symbol){c.mode='holding';c.holdQty=C.snapshot(db.transactions,c.symbol,asOf).shares;}
   break;}
  case 'ctBase': c.manualPrice=Number(el.value);break;
  case 'ctQty':
   if(c.mode==='holding'){
    const max=C.snapshot(db.transactions,c.symbol,asOf).shares;
    const qty=Number(el.value);
    if(!(qty>0&&qty<=max)){notify(`賣出股數須大於 0 且不超過 ${formatShares(max)} 股`);render();return;}
    c.holdQty=qty;
   }else c.manualQty=Number(el.value);
   break;
  case 'ctDiscount':c.discount=Number(el.value);break;
  case 'ctRate':c.feeRate=Number(el.value);break;
  case 'ctTax':c.taxMode=el.value;break;
  case 'ctTick':c.tickMode=el.value;break;
  case 'ctCustomTick':c.customTick=Number(el.value);break;
  case 'ctTarget':c.targetPrice=Number(el.value);break;
  default:return;
 }
 save();
}

document.addEventListener('submit',e=>{if(e.target.id!=='intradayForm')return;
 e.preventDefault();
 const symbol=$('#intraSymbol').value,date=$('#intraDate').value,time=$('#intraTime').value;
 const price=Number($('#intraPrice').value),high=$('#intraHigh').value===''?null:Number($('#intraHigh').value),low=$('#intraLow').value===''?null:Number($('#intraLow').value);
 if(date>today()){alert('盤中試算日期不可晚於今天。');return;}
 if(!/^\d{2}:\d{2}$/.test(time)){alert('請輸入有效的價格觀察時間。');return;}
 try{C.intraday(db.transactions,db.quotes,db.settings,{symbol,date,price,high,low});}
 catch(err){alert('無法試算：'+err.message);return;}
 intraSymbol=symbol;intraDate=date;
 const record={symbol,date,time,price,high,low,updatedAt:new Date().toISOString()};
 db.intradayPrices=(db.intradayPrices||[]).filter(x=>!(x.symbol===symbol&&x.date===date));db.intradayPrices.push(record);
 save();notify('盤中警示試算已更新（未改變正式行情）');
});
document.addEventListener('change',e=>{if(e.target.id.startsWith('ct'))updateCathay(e.target);if(e.target.id==='asOf'){asOf=e.target.value||today();render();}if(e.target.id==='stockFilter'){stockFilter=e.target.value;render();}if(e.target.id==='intraSymbol'){intraSymbol=e.target.value;render();}if(e.target.id==='intraDate'){intraDate=e.target.value||today();render();}if(['xlsxImport','csvImport','jsonImport'].includes(e.target.id))handleImport(e);});
document.addEventListener('input',e=>{if(e.target.id==='rowSearch'){const inp=e.target,focus={start:inp.selectionStart,end:inp.selectionEnd};rowSearch=inp.value;render();const t=$('#rowSearch');if(t){t.focus();t.setSelectionRange(focus.start,focus.end);}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#openMenu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#shade').classList.add('open');});$('#shade').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#shade').classList.remove('open');});

window.TradeCompassBridge={isActive:()=>active==='institutions',isPage:(page)=>active===page,render,navigate:(page)=>{active=page;render();window.scrollTo(0,0);},getETFConfig:()=>db.etfSimulation||null,saveETFConfig:(v)=>{db.etfSimulation=v;try{localStorage.setItem(STORAGE,JSON.stringify(db));}catch(err){persisted=false;}},
 getHoldings:()=>holdings().positions.map(p=>({symbol:p.symbol,name:nameOf(p.symbol),shares:p.shares,cost:p.cost,pnl:p.pnl}))};
render();
window.__financeDebug={getState:()=>db,calc:C,setDate:v=>{asOf=v;render();},loadDemo:demo,setPage:v=>{active=v;render();}};
})();
