name: 修正ETF投入收益曲線及0050配息資料發布

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-compass-pages
  cancel-in-progress: false

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch existing simulator without overwriting unrelated changes
        run: |
          set -euo pipefail
          python scripts/patch_etf_returns_v174.py
          node --check index_etf_returns.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index_etf_returns.js').read_text(encoding='utf-8')
          for marker in ('TC_ETF_INVESTMENT_CURVE_V174','TC_ETF_DIVIDEND_FALLBACK_V174',
                         'investmentCapitalChart(series)'):
              assert marker in s, f'New feature not present in JS: {marker}'
          print('PASS: chart and dividends fallback are installed in source')
          PY
      - name: Try official 0050 dividend archive refresh (retain validated old data on failure)
        run: |
          python scripts/refresh_0050_dividends.py
          if [ -f data/index-etf/dividends/0050.json ]; then
            echo '0050 archive exists in repository working tree.'
          else
            echo '::warning::0050 dividends file is unavailable; do not show invented cash distributions.'
          fi
      - name: Commit only simulator JS and verified 0050 dividend records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index_etf_returns.js
          if [ -f data/index-etf/dividends/0050.json ]; then
            git add data/index-etf/dividends/0050.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'fix: ETF investment curves and validated 0050 dividend archive'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo 'No source or verified dividend changes to commit.'
          fi
      - name: Stage full public site and dividend records once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.'); dst=Path('_site')
          if dst.exists():shutil.rmtree(dst)
          dst.mkdir()
          allowed={'.html','.js','.css','.svg','.png','.jpg','.jpeg','.webp','.ico','.json','.txt','.xml','.webmanifest'}
          for p in root.iterdir():
              if p.name in {'.git','.github','_site','node_modules','.venv','venv','__pycache__','tests','scripts'}:continue
              if p.is_file() and p.suffix.lower() in allowed:shutil.copy2(p,dst/p.name)
              elif p.name in {'data','assets','images','fonts'} and p.is_dir():shutil.copytree(p,dst/p.name)
          js=(dst/'index_etf_returns.js').read_text(encoding='utf-8')
          assert 'TC_ETF_INVESTMENT_CURVE_V174' in js
          assert 'TC_ETF_DIVIDEND_FALLBACK_V174' in js
          assert (dst/'index.html').exists()
          dividend=dst/'data/index-etf/dividends/0050.json'
          print('0050 dividend published in artifact:',dividend.exists())
          if not dividend.exists():print('::warning::0050 dividends are still unavailable; front-end will use validated GitHub source if accessible, otherwise show not included.')
          (dst/'.nojekyll').touch()
          print('Site files:',len([x for x in dst.rglob('*') if x.is_file()]))
          PY
          if [ -f _site/data/index-etf/dividends/0050.json ]; then
            echo '✅ 已打包 0050 配息 JSON（仍須核對涵蓋期間）。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ 0050 配息 JSON 缺漏；此版本仍顯示未含息警示，無法保證含息收益。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
      - name: Upload the single github-pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
