name: 一次性調整指數型ETF為報酬試算專頁
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index-etf-returns-only-source
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify source files and apply safe patch
        run: |
          python3 scripts/apply_index_etf_returns_only.py
          node --check index_etf.js
      - name: Commit only modified page source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index_etf.js index.html
          if git diff --cached --quiet; then
            echo 'Already installed; no new commit.'
            exit 0
          fi
          git commit -m 'ui: show only index ETF returns simulation'
          git pull --rebase origin main
          git push origin HEAD:main
