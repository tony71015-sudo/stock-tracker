name: 修正ETF報酬頁面並顯示網站資料警示
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trade-compass-pages
  cancel-in-progress: false
jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the focused page correction and site notice
        run: |
          python scripts/force_returns_only.py
          python scripts/add_site_notice.py
          node --check index_etf.js
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          j=Path('index_etf.js').read_text(encoding='utf-8')
          for x in ('TC_SITE_NOTICE_V1','採用任何資料前','查看修改說明與目前已知限制','指數型 ETF 報酬試算'):
              assert x in h, f'Missing webpage update: {x}'
          assert 'TC_RETURNS_ONLY_DIRECT_V2' in j
          assert '指數型 ETF 股價與投入報酬試算（含配息、分割、總收益）' in j
          assert 'index_etf_focus.js' not in h
          print('PASS: page title, warning, changes, returns widget all present')
          PY
      - name: Commit only changed website source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index_etf.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: ETF returns page and development disclaimer'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Stage public website assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          dst=Path('_site')
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir()
          for p in Path('.').iterdir():
              if p.name in {'.git','.github','_site','node_modules','.venv','venv','__pycache__','tests','scripts'}: continue
              if p.is_file() and p.suffix.lower() in {'.html','.js','.css','.svg','.png','.jpg','.jpeg','.webp','.ico','.json','.txt','.xml','.webmanifest'}:
                  shutil.copy2(p,dst/p.name)
              elif p.name in {'data','assets','images','fonts'} and p.is_dir():
                  shutil.copytree(p,dst/p.name)
          h=(dst/'index.html').read_text(encoding='utf-8')
          assert 'TC_SITE_NOTICE_V1' in h
          assert '指數型 ETF 報酬試算' in h
          assert (dst/'index_etf.js').is_file() and (dst/'index_etf_returns.js').is_file()
          print('PASS: the published website includes the warning and corrected ETF page')
          PY
      - name: Validate staged website and run offline regression tests
        run: python -B scripts/validate_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
