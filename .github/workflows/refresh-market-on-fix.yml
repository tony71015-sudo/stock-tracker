name: Refresh market snapshot after updater changes
on:
  push:
    branches: [main]
    paths: ['scripts/update_market.py', '.github/workflows/refresh-market-on-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_market.py
      - run: |
          git add data/market/latest.json
          git diff --cached --quiet && exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Refresh official market snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
