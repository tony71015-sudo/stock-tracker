name: 更新指數型 ETF 每日收盤價
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: '從各 ETF 實際上市月份重新回補完整歷史股價（首次建議選 true）'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 12 * * 1-5'  # 20:30 Asia/Taipei
permissions:
  contents: write
jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official daily market close history
        run: |
          if [ '${{ inputs.rebuild }}' = 'true' ]; then
            python scripts/update_index_etf_prices.py --rebuild
          else
            python scripts/update_index_etf_prices.py --backfill --max-months 30
          fi
      - name: Fetch official ETF cash distribution history
        run: python scripts/update_index_etf_dividends.py
      - name: Publish price and dividend archives without forced push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index-etf/prices data/index-etf/dividends
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'data: update official index ETF closes and distributions'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Conflict while rebasing price data. Stop rather than overwrite other updates.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*3))
          done
          echo 'Push still rejected after 5 retries'; exit 1
