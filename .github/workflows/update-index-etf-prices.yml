name: 更新指數型 ETF 官方歷史股價（自動補缺）
on:
  workflow_dispatch:
    inputs:
      full:
        description: '完整重查 2010 年起官方可取得月份（耗時較久）'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 12 * * 1-5'  # 20:30 Taiwan (UTC+8)
permissions:
  contents: write
concurrency:
  group: index-etf-prices-history
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch missing monthly closing prices from official TWSE
        shell: bash
        env:
          FULL_BACKFILL: ${{ inputs.full || 'false' }}
        run: |
          set -euo pipefail
          if [ "$FULL_BACKFILL" = 'true' ]; then
            python scripts/update_index_etf_prices.py --full --pause 0.6
          else
            python scripts/update_index_etf_prices.py --max-missing-months 18 --pause 0.6
          fi
      - name: Attempt official dividend updates (retain existing on failure)
        run: python scripts/update_index_etf_dividends.py
      - name: Publish archives with conflict-safe date merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_index_etf_prices.py
