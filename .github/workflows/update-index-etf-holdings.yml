name: 更新指數型ETF實際持股（官方來源實驗版）
on:
  workflow_dispatch:
  schedule:
    - cron: '40 11 * * 1-5' # Taiwan 19:40 on trading weekdays
permissions:
  contents: write
concurrency:
  group: index-etf-holdings-official
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch issuer actual holdings separately (failure is visible)
        shell: bash
        run: |
          success=0
          for code in 0050 006208 009816; do
            echo "::group::$code"
            if python scripts/update_index_etf_holdings.py --code "$code"; then
              success=$((success+1))
            else
              echo "::warning::$code official holdings unavailable; no synthetic snapshot stored"
            fi
            echo '::endgroup::'
          done
          echo "Valid issuer snapshots parsed: $success / 3"
          if [ "$success" -eq 0 ]; then
            echo '::error::None of the issuer sites yielded a validated full portfolio'
            exit 1
          fi
      - name: Commit only actual portfolio snapshots safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/index-etf-capture
          cp -a data/index-etf/history /tmp/index-etf-capture/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/index-etf/history
          if [ -d /tmp/index-etf-capture/history ]; then
            cp -an /tmp/index-etf-capture/history/. data/index-etf/history/
          fi
          # Only valid saved daily snapshots are indexed.
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('data/index-etf')
          for code in ('0050','006208','009816'):
              folder=root/'history'/code
              dates=[]
              for p in folder.glob('????-??-??.json'):
                  if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',p.stem): continue
                  try: s=json.loads(p.read_text(encoding='utf-8'))
                  except Exception: continue
                  if s.get('etf')==code and s.get('date')==p.stem and s.get('kind')=='actual_portfolio' and s.get('verified') is True and len(s.get('holdings',[]))>=40: dates.append(p.stem)
              index=root/'indexes'/f'{code}.json'
              index.parent.mkdir(parents=True,exist_ok=True)
              data={'schema':1,'etf':code,'dates':sorted(dates,reverse=True),'dataKind':'actual_portfolio', 'status':'comparable' if len(dates)>=2 else 'single_day' if dates else 'unavailable'}
              index.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/index-etf/history data/index-etf/indexes
          if git diff --cached --quiet; then echo 'Nothing to commit'; exit 0; fi
          git commit -m 'data: validated index ETF actual holdings snapshots'
          git push origin HEAD:main
