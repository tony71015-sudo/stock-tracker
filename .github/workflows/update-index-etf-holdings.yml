name: 更新指數型ETF持股（來源診斷與安全累積版）
on:
  workflow_dispatch:
    inputs:
      allow_third_party:
        description: '使用明確標示的 MoneyDJ 全部持股備援（非官方）'
        type: boolean
        default: true
      backfill_days:
        description: '006208 既有官方持股歷史回查日數（最多12）；0050及009816依來源可得日期每日累積'
        default: '12'
  schedule:
    - cron: '40 11 * * 1-5'  # 台灣時間 19:40
permissions:
  contents: write
concurrency:
  group: index-etf-holdings-v2
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parsing dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch issuer holdings, log each result and keep failures visible
        shell: bash
        env:
          DISPATCH_THIRD_PARTY: ${{ inputs.allow_third_party }}
          DISPATCH_DAYS: ${{ inputs.backfill_days }}
        run: |
          set -uo pipefail
          flags=()
          if [ "${DISPATCH_THIRD_PARTY:-true}" != 'false' ]; then flags+=(--allow-third-party); fi
          days="${DISPATCH_DAYS:-12}"
          for code in 0050 006208 009816; do
            echo "::group::${code} holdings"
            python scripts/update_index_etf_holdings.py --code "$code" --backfill-days "$days" "${flags[@]}" || echo "::warning::${code} parser/runtime error; see above"
            echo '::endgroup::'
          done
      - name: Preserve captures and publish without git rebase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tc-index-etf-data
          cp -a data/index-etf/history /tmp/tc-index-etf-data/ 2>/dev/null || true
          cp -a data/index-etf/capture-status /tmp/tc-index-etf-data/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for trial in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/index-etf/history data/index-etf/capture-status
            if [ -d /tmp/tc-index-etf-data/history ]; then cp -an /tmp/tc-index-etf-data/history/. data/index-etf/history/; fi
            if [ -d /tmp/tc-index-etf-data/capture-status ]; then cp -a /tmp/tc-index-etf-data/capture-status/. data/index-etf/capture-status/; fi
            python scripts/rebuild_index_etf_indexes.py
            python scripts/report_index_etf_12days.py
            python scripts/patch_index_etf_validation.py
            git add data/index-etf/history data/index-etf/indexes data/index-etf/capture-status data/index-etf/coverage/twelve-day-goal.json index_etf.js
            if git diff --cached --quiet; then
              echo 'No new snapshots or status changes'
              break
            fi
            git commit -m 'data: verify and preserve index ETF snapshots' >/dev/null
            if git push origin HEAD:main; then
              echo 'Successfully published verified snapshots and status'
              break
            fi
            if [ "$trial" = 5 ]; then echo '::error::Unable to push after 5 safe retries'; exit 1; fi
            echo "::warning::Remote changed; safe retry ${trial}"
            sleep 2
          done
          echo '## ETF 持股匯入結果（目標：各12個有效日期）' >> "$GITHUB_STEP_SUMMARY"
          python scripts/report_index_etf_12days.py
          python -c 'import json; r=json.load(open("data/index-etf/coverage/twelve-day-goal.json")); [print("- %s: %s/12 日；還差 %s 日" % (c,x["availableTradingDates"],x["remainingToTarget"])) for c,x in r["funds"].items()]' >> "$GITHUB_STEP_SUMMARY"
          for code in 0050 006208 009816; do
            echo "### $code" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "data/index-etf/capture-status/$code.json" ]; then
              python - "$code" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          s=json.load(open('data/index-etf/capture-status/'+sys.argv[1]+'.json'))
          print('結果：',s['status'],'| 新增快照：',s['newSnapshots'])
          for err in s.get('errors',[])[:6]:print('- '+err.replace('<','&lt;'))
          PY
            fi
          done
