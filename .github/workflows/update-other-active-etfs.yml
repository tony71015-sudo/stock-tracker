name: 更新其他台股主動式ETF持股並發布網站（來源不足標示無法比較）

on:
  schedule:
    # 21:55 Asia/Taipei weekdays. Collector generally offers T+1 for some issuers.
    - cron: '55 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-compass-pages
  cancel-in-progress: false

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain maintained issuer-site crawler
        run: |
          git clone --depth 1 https://github.com/SheenArtem/TWActiveETFCrawler.git /tmp/tw-active-etf-crawler
      - name: Install crawler dependencies
        run: |
          python -m pip install -r /tmp/tw-active-etf-crawler/requirements.txt
          python -m playwright install chromium
      # Isolate each issuer so a slow/broken site cannot starve all later issuers.
      # --all previously timed out after 1950s with no issuer-by-issuer diagnosis.
      - name: Collect each supported issuer independently
        shell: bash
        run: |
          set -uo pipefail
          cd /tmp/tw-active-etf-crawler
          mkdir -p data
          : > issuer_results.txt
          # The crawler's documented CLI flags; exclude EZMoney (separate job).
          issuers=(nomura capital fhtrust ctbc fsitc tsit allianz cathay morgan fubon abfunds megafunds kgi sinopac)
          for issuer in "${issuers[@]}"; do
            echo "::group::issuer $issuer"
            echo "START $issuer $(date -u +%FT%TZ)" | tee -a issuer_results.txt
            timeout --signal=TERM --kill-after=10s 130s python main.py "--$issuer" > "issuer_${issuer}.log" 2>&1
            rc=$?
            tail -n 12 "issuer_${issuer}.log" || true
            echo "RESULT $issuer rc=$rc $(date -u +%FT%TZ)" | tee -a issuer_results.txt
            echo "::endgroup::"
          done
          if [ -f data/etf_holdings.db ]; then
            python - <<'PY_DIAG'
          import sqlite3
          from pathlib import Path
          db=Path('data/etf_holdings.db')
          con=sqlite3.connect(str(db))
          try:
              rows=con.execute('SELECT etf_code, COUNT(*), COUNT(DISTINCT date) FROM holdings GROUP BY etf_code ORDER BY etf_code').fetchall()
              for code,count,dates in rows:
                  print(f'SQLITE_ETF {code} rows={count} dates={dates}')
          except sqlite3.Error as e:
              print('::warning::Unable to summarize SQLite holdings:',e)
          finally:
              con.close()
          PY_DIAG
          else
            echo '::warning::No SQLite file was created by issuer crawlers'
          fi
          # Individual source failures are reported and are not silently treated
          # as usable complete portfolios.
      - name: Publish per-issuer crawl logs for diagnosis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-etf-crawler-diagnostics
          path: |
            /tmp/tw-active-etf-crawler/issuer_results.txt
            /tmp/tw-active-etf-crawler/issuer_*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate and archive available issuer-reported holdings
        run: |
          if [ -f /tmp/tw-active-etf-crawler/data/etf_holdings.db ]; then
            python scripts/import_other_active_etfs.py --sqlite /tmp/tw-active-etf-crawler/data/etf_holdings.db
          else
            echo '::warning::No SQLite from crawler; publish existing archive without pretending data was updated.'
          fi
      - name: Install alternative actual-holdings parser
        run: python -m pip install beautifulsoup4
      - name: Collect alternative portfolio sources (fail closed on partial/PCF)
        run: |
          python scripts/import_alternative_active_etfs.py --fetch-all
      - name: Commit public ETF snapshots only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/active-etf
          if ! git diff --cached --quiet; then
            git commit -m 'data: archive other active ETF issuer holdings'
            for attempt in 1 2 3 4 5; do
              echo "Sync attempt $attempt"
              git fetch origin main
              if ! git rebase origin/main; then
                # Only the known, structured status metadata can be auto-merged.
                # An unexpected file conflict must be reviewed, never discarded.
                conflicts=$(git diff --name-only --diff-filter=U)
                if [ "$conflicts" != 'data/active-etf/status.json' ]; then
                  echo "::error::Unexpected rebase conflict: $conflicts"
                  git rebase --abort || true
                  exit 1
                fi
                if ! python scripts/merge_active_etf_status.py; then
                  git rebase --abort || true
                  exit 1
                fi
                git add data/active-etf/status.json
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort || true
                  exit 1
                fi
              fi
              if git push origin HEAD:main; then
                echo 'Snapshot commit pushed successfully'
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo '::error::Remote branch kept changing; no force push attempted'
                exit 1
              fi
            done
          else
            echo 'No changed ETF snapshots to commit'
          fi
      - name: Stage public site
        run: |
          mkdir -p _site/data
          cp index.html institutional.js institutional.css etf_simulator.js market.js active_etf.js index_etf.js tools.css _site/
          # Optional datasets do not exist before the first successful fetch.
          for dataset in institutional market active-etf index-etf; do
            if [ -d "data/$dataset" ]; then
              cp -R "data/$dataset" "_site/data/$dataset"
            else
              echo "::notice::Skipping unavailable optional dataset: data/$dataset"
            fi
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
