name: PR 自動檢查（不發布網站）

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    name: 網站與 ETF 離線回歸測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Validate frontend and run offline regression tests
        run: python -B scripts/validate_site.py .
      - name: Verify 0050 dividend parser and missing-data safety
        run: python -m unittest discover -s tests -p 'test_refresh_0050_dividends.py' -v
