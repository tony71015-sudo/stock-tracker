name: 更新三大法人、股票行情並發布網站

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'institutional.js'
      - 'institutional.css'
      - 'etf_simulator.js'
      - 'market.js'
      - 'active_etf.js'
      - 'index_etf.js'
      - 'index_etf_returns.js'
      - 'tools.css'
      - 'scripts/**'
      - 'data/active-etf/sources.json'
      - '.github/workflows/update-institutions.yml'
  schedule:
    # Taiwan local 20:35 and 22:35 weekdays (UTC 12:35 and 14:35).
    - cron: '35 12,14 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '法人更新範圍（首次建議 bootstrap）'
        type: choice
        required: true
        default: auto
        options: [auto, bootstrap, daily]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-compass-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official institutional reports
        env:
          UPDATE_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/update_institutions.py --mode "$UPDATE_MODE"
      - name: Fetch official TWSE whole-market institutional money flows (BFI82U)
        env:
          UPDATE_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          python scripts/update_market_flows.py --mode "$UPDATE_MODE" || echo '::warning::TWSE whole-market money flows unavailable; previously validated records retained.'
      - name: Fetch official TWSE/TPEx after-close OHLCV and day trading
        run: |
          python scripts/update_market.py || echo '::warning::Stock market snapshot unavailable; showing the previous validated data or an empty warning.'
      # Active ETF holdings have their own dedicated workflows.
      # Do not update data/active-etf here: its uncommitted files block git rebase.
      - name: Commit public market datasets to repository (safe retry)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Active ETF snapshots are published by their dedicated workflow.
          # Avoid rewriting their shared status.json from this workflow.
          git add -A -- data/institutional data/market
          # Defensive isolation: other updaters own active ETF snapshots.
          # Never try to rebase over changes from an unrelated data pipeline.
          if [ -n "$(git status --porcelain -- data/active-etf)" ]; then
            echo '::notice::Discarding transient active ETF edits in this job; dedicated ETF workflows publish these snapshots.'
            git restore --worktree -- data/active-etf || true
            git clean -fd -- data/active-etf
          fi
          if git diff --cached --quiet; then
            echo "Public data unchanged"
          else
            git commit -m "data: refresh public institutional and market datasets"
            # If future scripts generate additional untracked/modified files,
            # isolate them rather than allowing an unsafe rebase or force push.
            if [ -n "$(git status --porcelain)" ]; then
              echo '::warning::Other generated files exist; stashing them for this data-only push.'
              git stash push --include-untracked -m 'temporary unrelated generated data'
            fi
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo '::error::Data conflict. Please inspect changes; never force push.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Public market datasets pushed successfully.'
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo '::error::Could not push after 5 tries.'
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
      - name: Stage public website assets
        run: |
          mkdir -p _site/data
          # Preserve core assets; optionally stage newer frontend modules.
          for file in index.html institutional.js institutional.css etf_simulator.js market.js active_etf.js index_etf.js index_etf_returns.js tools.css; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            elif [ "$file" = index_etf_returns.js ]; then
              echo '::warning::Missing index_etf_returns.js in repository main; index ETF return simulator cannot load.'
            else
              echo "::warning::Missing optional or legacy website asset: $file"
            fi
          done
          # Optional datasets do not exist before the first successful fetch.
          for dataset in institutional market active-etf index-etf; do
            if [ -d "data/$dataset" ]; then
              cp -R "data/$dataset" "_site/data/$dataset"
            else
              echo "::notice::Skipping unavailable optional dataset: data/$dataset"
            fi
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
