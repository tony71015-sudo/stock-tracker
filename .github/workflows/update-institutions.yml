name: 更新三大法人、股票行情並發布網站

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'institutional.js'
      - 'institutional.css'
      - 'etf_simulator.js'
      - 'market.js'
      - 'active_etf.js'
      - 'index_etf.js'
      - 'index_etf_returns.js'
      - 'tools.css'
      - 'scripts/**'
      - 'data/active-etf/sources.json'
      - '.github/workflows/update-institutions.yml'
  schedule:
    # Taiwan local 16:20, 20:35 and 22:35 weekdays (UTC 08:20, 12:35, 14:35).
    # Early run publishes newly available official reports; evening runs capture later corrections.
    - cron: '20 8 * * 1-5'
    - cron: '35 12,14 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '法人更新範圍（首次建議 bootstrap）'
        type: choice
        required: true
        default: auto
        options: [auto, bootstrap, daily]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-compass-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official institutional reports
        env:
          UPDATE_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/update_institutions.py --mode "$UPDATE_MODE"
      - name: Fetch official TWSE whole-market institutional money flows (BFI82U)
        env:
          UPDATE_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          python scripts/update_market_flows.py --mode "$UPDATE_MODE" || echo '::warning::TWSE whole-market money flows unavailable; previously validated records retained.'
      - name: Fetch official TWSE/TPEx after-close OHLCV and day trading
        run: |
          python scripts/update_market.py || echo '::warning::Stock market snapshot unavailable; showing the previous validated data or an empty warning.'
      # Active ETF holdings have their own dedicated workflows.
      # Do not update data/active-etf here: its uncommitted files block git rebase.
      - name: Publish public market datasets (reconcile concurrent updates)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_SHA="$(git rev-parse HEAD)"
          SNAP_DIR="$(mktemp -d)"
          trap 'rm -rf "$SNAP_DIR"' EXIT
          python scripts/reconcile_public_market_data.py snapshot --directory "$SNAP_DIR"
          for attempt in 1 2 3 4 5; do
            echo "::group::Publish attempt $attempt of 5"
            git fetch origin main
            # Only reset this temporary GitHub Actions checkout. Snapshot data is in $SNAP_DIR.
            # This avoids git rebase on four concurrently generated JSON files.
            git reset --hard origin/main
            python scripts/reconcile_public_market_data.py apply --directory "$SNAP_DIR" --base "$BASE_SHA"
            git add -A -- data/institutional data/market
            if git diff --cached --quiet; then
              echo '::notice::No newer public institutional/market data to commit; use latest remote assets.'
              echo '::endgroup::'
              break
            fi
            git commit -m 'data: reconcile public institutional and market datasets'
            if git push origin HEAD:main; then
              echo '::notice::Published institutional and market data to main.'
              echo '::endgroup::'
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo '::error::Data push rejected after 5 attempts; no force push performed.'
              exit 1
            fi
            echo '::warning::Remote changed; reloading latest main and reconciling again.'
            echo '::endgroup::'
            sleep "$((attempt * 2))"
          done
      - name: Stage public website assets
        run: |
          mkdir -p _site/data
          # Preserve core assets; optionally stage newer frontend modules.
          for file in index.html institutional.js institutional.css etf_simulator.js market.js active_etf.js index_etf.js index_etf_returns.js tools.css; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            elif [ "$file" = index_etf_returns.js ]; then
              echo '::warning::Missing index_etf_returns.js in repository main; index ETF return simulator cannot load.'
            else
              echo "::warning::Missing optional or legacy website asset: $file"
            fi
          done
          # Optional datasets do not exist before the first successful fetch.
          for dataset in institutional market active-etf index-etf; do
            if [ -d "data/$dataset" ]; then
              cp -R "data/$dataset" "_site/data/$dataset"
            else
              echo "::notice::Skipping unavailable optional dataset: data/$dataset"
            fi
          done
          touch _site/.nojekyll
      - name: Validate staged website and run offline regression tests
        run: python -B scripts/validate_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
